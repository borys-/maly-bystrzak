<head>

    <title>Mały Bystrzak — generator książeczek dla dzieci</title>
    <meta name="description" content="Twórz kolorowe książeczki Sudoku i Kakuro dla dzieci. Gotowe PDF-y powstają lokalnie w przeglądarce." />
    <meta name="theme-color" content="#25316d" />
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
