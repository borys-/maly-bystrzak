name: Weryfikacja i publikacja GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Kompilacja i testy
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.61.0-noble
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Zainstaluj .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Przywróć zależności
        run: dotnet restore MalyBystrzak.sln

      - name: Skompiluj rozwiązanie
        run: dotnet build MalyBystrzak.sln -c Release --no-restore

      - name: Uruchom testy domenowe i integracyjne
        run: dotnet test tests/MalyBystrzak.Tests/MalyBystrzak.Tests.csproj -c Release --no-build

      - name: Opublikuj aplikację WebAssembly
        run: dotnet publish src/MalyBystrzak.Web/MalyBystrzak.Web.csproj -c Release --no-build -o publish

      - name: Uruchom testy przeglądarkowe opublikowanej aplikacji
        run: dotnet test tests/MalyBystrzak.Web.E2E/MalyBystrzak.Web.E2E.csproj -c Release --no-build
        env:
          MALY_BYSTRZAK_PUBLISHED_DIR: ${{ github.workspace }}/publish/wwwroot

      - name: Przygotuj aplikację dla ścieżki GitHub Pages
        shell: pwsh
        run: |
          $index = "publish/wwwroot/index.html"
          (Get-Content $index -Raw).Replace('<base href="/" />', '<base href="/maly-bystrzak/" />') | Set-Content $index -NoNewline
          Copy-Item $index "publish/wwwroot/404.html"
          New-Item "publish/wwwroot/.nojekyll" -ItemType File

      - name: Przekaż artefakt GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    name: Publikacja
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
